name: Release

on:
  push:
    tags: ['[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Package
        run: |
          make package VERSION="$TAG"
          cp "mackaysoftware-$TAG.tar.gz" mackaysoftware.tar.gz
          shasum -a 256 "mackaysoftware-$TAG.tar.gz" mackaysoftware.tar.gz > SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}

      # Re-running the workflow replaces the assets rather than failing.
      - name: Publish GitHub Release
        run: |
          assets="mackaysoftware-$TAG.tar.gz mackaysoftware.tar.gz SHA256SUMS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $assets --clobber
          else
            gh release create "$TAG" $assets --verify-tag --title "$TAG" --generate-notes
          fi
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
